name: WAF build

on:
  push:
    branches: [forever, feat/forever-prototype]
  pull_request:
    branches: [forever, feat/forever-prototype]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1

      - name: Run regression checks
        run: lua5.1 tests/run.lua

      - name: Verify offline save migration
        run: python3 -B tests/migrate_legacy_saves_test.py

      - name: Build and validate Forever package
        run: python3 tools/build_forever.py

      - name: Upload installable alpha ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WeakAurasForever-alpha-${{ github.sha }}
          path: .release/WeakAurasForever-*.zip
          include-hidden-files: true
          if-no-files-found: error
          archive: false
