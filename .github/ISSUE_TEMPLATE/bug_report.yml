name: Bug report
description: Report a WeakAurasForever problem on the Forever client.
body:
  - type: input
    id: version
    attributes:
      label: WeakAurasForever version and WoW build
      description: Find WAF's version in the editor title or WAF.toc. Run /dump GetBuildInfo() for the client build.
      placeholder: 5.22.0-waf.3 / Forever 1.60.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Include steps to reproduce, expected behavior, and whether this happened in combat, after reload, or after relogging.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error
      description: Enable /console scriptErrors 1 and paste any error, if available.
      render: text
  - type: textarea
    id: addons
    attributes:
      label: Other addons and relevant aura
      description: List other enabled addons and optionally attach a minimal aura export or screenshot. Keep personal account information out of the report.
